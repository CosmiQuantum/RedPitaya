[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "RedPitayaDAQ"
version = "0.0.2"
description = "Local and SSH-based Red Pitaya data acquisition interfaces"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "h5py", "matplotlib", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["RedPitayaDAQ", "RedPitayaDAQ.*"]
namespaces = false
